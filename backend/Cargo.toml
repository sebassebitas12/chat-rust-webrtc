[package]
name = "chat-rust-webrtc-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Backend HTTP base para chat privado 1:1"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
